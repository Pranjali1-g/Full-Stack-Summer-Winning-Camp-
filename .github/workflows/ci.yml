name: CineVerse CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your source code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Java 17 natively (GitHub manages the installation path)
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Caches dependencies to speed up the build

      # Step 3: Run compilation and package verification safely using the Maven Wrapper
      - name: Build and Run Tests
        run: |
          cd cineverse/day-10/booking-service
          chmod +x mvnw
          ./mvnw clean test